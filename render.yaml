# LexiMind on Render (M4 phase 8).
#
# Two services from one Blueprint: the API as a Docker service with a disk,
# and the React build as a static site.
#
#   Render Dashboard -> New -> Blueprint -> pick this repo
#
# Validate changes before pushing them (Render CLI v2.7+):
#
#   render blueprints validate
#
# ── The one thing to know before the first deploy ──────────────────────
# CORS_ORIGINS needs the frontend's URL and VITE_API_URL needs the API's,
# and neither URL exists until both services have been created. So the first
# deploy is expected to fail CORS. Once both are up, set the two values in
# the Dashboard, restart the API and redeploy the frontend. That is the
# ordering, not a misconfiguration.
#
# Both are marked `sync: false`, which means Render prompts for them rather
# than reading them from this file, and never overwrites what you set.

services:
  # ── API ──────────────────────────────────────────────────────────────
  - type: web
    name: leximind-api
    runtime: docker
    region: frankfurt
    # standard = 2GB RAM. Not negotiable downward: torch, a LanguageTool JVM
    # and DistilGPT-2 are resident simultaneously, and free/starter (512MB)
    # cannot hold them. The image is ~3.2GB, of which ~900MB is model weights
    # baked in at build time so no request pays to download them.
    plan: standard
    dockerfilePath: ./Dockerfile
    dockerContext: .

    # /health answers immediately and keeps status "ok" while models warm on
    # their background threads, so a slow model never takes the instance out
    # of rotation — exactly what this probe wants.
    healthCheckPath: /health

    # Deploy only after GitHub checks pass. The CI and Image workflows both
    # gate this, so a red suite cannot reach production.
    autoDeployTrigger: checksPass

    # The database is one SQLite file on this disk.
    #
    # Attaching a disk pins the service to a single instance and disables
    # zero-downtime deploys. Normally that is a cost; here it is the required
    # behaviour, since SQLite has exactly one writer. Do not add numInstances
    # or scaling to this service.
    #
    # 1GB is ample for accounts, documents and session history. Disks can grow
    # later but never shrink, so starting small is the reversible direction.
    disk:
      name: leximind-data
      mountPath: /data
      sizeGB: 1

    envVars:
      # Four slashes = an absolute path. Three would resolve relative to the
      # working directory and put the database back inside the container,
      # where every redeploy would wipe every account.
      - key: DATABASE_URL
        value: sqlite:////data/leximind.db

      # Generated by Render and never seen by anyone. Rotating it invalidates
      # every issued JWT, which logs all users out.
      - key: SECRET_KEY
        generateValue: true

      # Only /reading/simplify needs this, and the Groq client is built lazily
      # inside the request — so a missing key fails that one route with a 503
      # and leaves everything else working.
      - key: GROQ_API_KEY
        sync: false

      # The frontend's URL, comma-separated. localhost:5173 and 127.0.0.1:5173
      # are always appended in code, so do not list them here.
      # Read at import: changing it needs a restart, not just a redeploy of
      # the other service.
      - key: CORS_ORIGINS
        sync: false

  # ── frontend ─────────────────────────────────────────────────────────
  - type: web
    name: leximind-web
    runtime: static
    rootDir: frontend
    # `npm ci`, not `npm install`: it builds strictly from the lockfile. That
    # distinction already caught a real bug here — a prop-types import that
    # resolved from a drifted local node_modules and broke the bundle.
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    autoDeployTrigger: checksPass

    routes:
      # Single-page app: React Router owns /reading, /writing, /analytics and
      # the rest, so every path has to serve index.html. Without this, opening
      # a deep link or refreshing anywhere but / returns 404.
      - type: rewrite
        source: /*
        destination: /index.html

    envVars:
      # Vite substitutes this at BUILD time, not runtime, so changing it
      # requires rebuilding the frontend rather than restarting it.
      - key: VITE_API_URL
        sync: false
