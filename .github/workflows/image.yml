# Build the API image and prove it works (M4 phase 7).
#
# Separate from ci.yml because it is slow — torch, ~700MB of model weights and
# a JRE — and only needs to run when something that shapes the image changes.
# Run it by hand from the Actions tab for anything else.
#
# What "works" means here, and the one check each property gets:
#
#   builds           the prefetch step imports torch and loads every model, so a
#                    broken dependency fails the build rather than shipping
#   is warm          /health reports all four models ready, not the wordfreq
#                    fallback, not "grammar unavailable"
#   is self-contained  the weights load with the network switched off
#   runs unprivileged  the process is not root
#   keeps data       an account survives the container being replaced — the
#                    phase-9 disk test, run before there is a disk to test
#   leaks nothing    no .env file made it into a layer
name: Image

on:
  workflow_dispatch:
  push:
    branches: [main, "M*-dev"]
    paths:
      - Dockerfile
      - .dockerignore
      - docker-compose.yml
      - backend/requirements.txt
      - scripts/prefetch_models.py
      - .github/workflows/image.yml
  pull_request:
    branches: [main]
    paths:
      - Dockerfile
      - .dockerignore
      - backend/requirements.txt
      - scripts/prefetch_models.py

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-verify:
    name: Build and verify the API image
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      IMAGE: leximind-api:ci
      # Test-only values. The real SECRET_KEY is generated by the host.
      SECRET_KEY: ci-only-not-a-real-secret-do-not-reuse
      PERSIST_EMAIL: persistence-check@example.com
      PERSIST_PASSWORD: PersistPassw0rd!23

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # mode=max caches every layer, including the ~1GB of baked weights, so a
      # change to application code rebuilds in minutes rather than re-running
      # the whole prefetch.
      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: ${{ env.IMAGE }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Image size
        run: |
          docker image ls "$IMAGE" --format 'image size: {{.Size}}'
          # The five largest layers - where to look if the size ever jumps.
          docker history "$IMAGE" --format '{{.Size}}\t{{.CreatedBy}}' \
            | sort -h -r | head -5 | cut -c1-140

      - name: Runs as an unprivileged user
        run: |
          uid=$(docker run --rm "$IMAGE" id -u)
          echo "uid=$uid"
          [ "$uid" != "0" ] || { echo "::error::the API runs as root"; exit 1; }

      - name: No secrets baked in
        run: |
          # .dockerignore excludes them; this proves it, rather than trusting it.
          #
          # The `|| true` is load-bearing. This step runs under `bash -e`, and
          # find exits 1 whenever it could not read a directory — which it
          # cannot, running as the unprivileged `app` user across /root and
          # parts of /var. Sending those messages to /dev/null hides the noise
          # but not the exit status, so without this the step fails before it
          # has printed either its verdict or its error.
          #
          # -xdev keeps it on the image's own filesystem rather than walking
          # /proc and /sys.
          found=$(docker run --rm "$IMAGE" sh -c \
            'find / -xdev \( -name ".env" -o -name ".env.*" \) 2>/dev/null || true')

          if [ -n "$found" ]; then
            echo "::error::secrets baked into the image: $found"
            exit 1
          fi
          echo "no .env files in the image"

      - name: Weights load with the network off
        run: |
          # The point of baking them in. If any of these reaches for the
          # network, the first request after every deploy would too.
          docker run --rm --network none -e HF_HUB_OFFLINE=1 "$IMAGE" python -c "
          from transformers import AutoModelForCausalLM, AutoTokenizer
          AutoTokenizer.from_pretrained('distilgpt2')
          AutoModelForCausalLM.from_pretrained('distilgpt2')
          print('distilgpt2: loaded offline')

          import easyocr
          easyocr.Reader(['en'], gpu=False, verbose=False, download_enabled=False)
          print('easyocr: loaded offline')

          import nltk
          for resource in ('corpora/cmudict', 'corpora/wordnet', 'corpora/words'):
              nltk.data.find(resource)
          print('nltk corpora: present')
          "

      - name: Start the container on a volume
        run: |
          docker volume create leximind-ci-data
          docker run -d --name api -p 8000:8000 \
            -v leximind-ci-data:/data -e SECRET_KEY "$IMAGE"

      - name: Warm, and every model ready
        # Stdlib only, so it runs on the runner's own Python with no install.
        run: python3 scripts/ci_wait_for_health.py --url http://127.0.0.1:8000 --timeout 300

      - name: Create an account
        run: |
          curl -sf -X POST http://127.0.0.1:8000/auth/register \
            -H 'Content-Type: application/json' \
            -d "{\"name\":\"Persistence\",\"email\":\"$PERSIST_EMAIL\",\"password\":\"$PERSIST_PASSWORD\"}" \
            > /dev/null
          echo "registered $PERSIST_EMAIL"

      - name: Replace the container, keep the volume
        run: |
          # A redeploy in miniature: the container is destroyed and a new one
          # starts from the same image on the same volume.
          docker rm -f api
          docker run -d --name api -p 8000:8000 \
            -v leximind-ci-data:/data -e SECRET_KEY "$IMAGE"
          python3 scripts/ci_wait_for_health.py --url http://127.0.0.1:8000 --timeout 300

      - name: The account survived
        run: |
          status=$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:8000/auth/login \
            -H 'Content-Type: application/json' \
            -d "{\"email\":\"$PERSIST_EMAIL\",\"password\":\"$PERSIST_PASSWORD\"}")
          echo "login after replacement: $status"
          [ "$status" = "200" ] || {
            echo "::error::the account did not survive a container replacement - DATABASE_URL is not on the volume"
            exit 1
          }

      - name: Container log
        if: always()
        run: docker logs api 2>&1 | tail -80 || true
